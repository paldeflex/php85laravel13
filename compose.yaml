services:
    php:
        build:
            context: .
            dockerfile: _docker/php/Dockerfile
        container_name: php85laravel13-php
        working_dir: /var/www/html
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        volumes:
            - ./:/var/www/html

    nginx:
        build:
            context: .
            dockerfile: _docker/nginx/Dockerfile
        container_name: php85laravel13-nginx
        depends_on:
            - php
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./_docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    mysql:
        image: mysql:8.4
        container_name: php85laravel13-mysql
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: php85laravel13
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot || exit 1"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 20s

    redis:
        image: redis:8-alpine
        container_name: php85laravel13-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: [ "redis-server", "--appendonly", "yes" ]

    redisinsight:
        image: redis/redisinsight:latest
        container_name: php85laravel13-redisinsight
        depends_on:
            - redis
        ports:
            - "5540:5540"
        volumes:
            - redisinsight_data:/data

volumes:
    mysql_data:
    redis_data:
    redisinsight_data:
